<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#162033;--muted:#6b7280;--line:#e5e7eb;--a:#4f46e5;--good:#059669;--warn:#d97706;--bad:#dc2626;--shadow:0 8px 28px #11182712;color-scheme:light}html[data-theme=dark]{--bg:#090d17;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--line:#283244;--a:#818cf8;--shadow:0 12px 35px #0007;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 calc(82px + env(safe-area-inset-bottom))}button,input,select{font:inherit}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 8px}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:800}.top h1{margin:3px 0 0;font-size:25px}.icon{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px}.period{display:grid;grid-template-columns:44px 1fr 44px;gap:9px;padding:8px 16px 12px}.period button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px}.period-main{padding:9px;text-align:center}.period-main strong{display:block}.period-main small{color:var(--muted)}main{padding:4px 14px 24px}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 13%,var(--card)),var(--card))}.label{font-size:10px;color:var(--muted);font-weight:800}.big{font-size:31px;font-weight:900;margin:5px 0}.kpi{font-size:19px;font-weight:900;margin-top:4px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:end;margin:17px 3px 9px}.section h2{font-size:17px;margin:0}.section p{margin:2px 0 0;font-size:10px;color:var(--muted)}.btn{border:0;background:var(--a);color:white;border-radius:13px;padding:10px 13px;font-weight:800}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--bad)}.btn.small{padding:7px 9px;font-size:11px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:15px;padding:12px 5px;font-size:10px;font-weight:800}.quick b{display:block;font-size:20px;margin-bottom:5px}.list{display:flex;flex-direction:column;gap:8px}.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.item strong{font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}.amount{text-align:right;font-weight:900}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}.critical{color:var(--bad)}.important{color:var(--warn)}.flexible{color:var(--good)}.progress{height:7px;background:color-mix(in srgb,var(--muted) 13%,transparent);border-radius:999px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--a)}.alert{border-left:4px solid var(--warn);background:var(--card);border-radius:14px;padding:11px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:13px;font-size:10px;font-weight:800}.nav button b{display:block;font-size:20px;line-height:1;margin-bottom:4px}.nav button.active{color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent)}dialog{border:0;padding:0;background:transparent;width:min(620px,calc(100% - 18px));max-height:90vh}dialog::backdrop{background:#020617a8;backdrop-filter:blur(4px)}.modal{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:23px;overflow:hidden}.mhead{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid var(--line)}.mhead h2{margin:0;font-size:18px}.mbody{padding:15px;max-height:64vh;overflow:auto}.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 15px;border-top:1px solid var(--line)}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);font-weight:800}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.search input,.search select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px}.menu{display:flex;flex-direction:column;gap:8px}.menu button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:13px;text-align:left;font-weight:800}.menu small{display:block;color:var(--muted);margin-top:3px;font-weight:500}.bars{display:flex;flex-direction:column;gap:9px}.barrow{display:grid;grid-template-columns:100px 1fr 65px;gap:8px;align-items:center;font-size:10px}.bar{height:9px;background:color-mix(in srgb,var(--muted) 13%,transparent);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.empty{text-align:center;color:var(--muted);padding:22px 8px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(15px);background:#111827;color:#fff;padding:10px 13px;border-radius:13px;font-size:11px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:480px){.form{grid-template-columns:1fr}.field.full{grid-column:auto}.barrow{grid-template-columns:82px 1fr 58px}}
</style>

<body>
<div class="app">
<header class="top"><div><div class="eyebrow">CONTROL PERSONAL</div><h1>Mi Dinero</h1></div><button class="icon" id="theme">◐</button></header>
<div class="period"><button id="prev">‹</button><button class="period-main" id="period"><strong id="periodName">Periodo</strong><small id="periodRange">—</small></button><button id="next">›</button></div>
<main id="view"></main>
</div>
<nav class="nav" id="nav"><button data-r="home" class="active"><b>⌂</b>Inicio</button><button data-r="payments"><b>✓</b>Pagos</button><button data-r="loans"><b>↔</b>Préstamos</button><button data-r="moves"><b>≡</b>Movimientos</button><button data-r="more"><b>•••</b>Más</button></nav>
<dialog id="dlg"><div class="modal"><div class="mhead"><h2 id="dlgTitle"></h2><button class="icon" onclick="dlg.close()">×</button></div><div class="mbody" id="dlgBody"></div><div class="mfoot" id="dlgFoot"></div></div></dialog>
<input id="restore" type="file" accept="application/json" hidden><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}), uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36); const KEY='miDinero_v1';
const defaults={settings:{payDay:15,theme:'light',budget:0},categories:['Vivienda','Servicios','Alimentación','Movilidad','Educación','Salud','Familia','Suscripciones','Préstamos','Otros'],periods:{},templates:[],loans:[],accounts:[],moves:[]};
let db=load(),route='home',pk=periodKey(new Date()); function load(){try{return Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(defaults)}} function save(){localStorage.setItem(KEY,JSON.stringify(db))} function dateISO(d){return d.toISOString().slice(0,10)} function parseD(s){let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)} function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x} function startFor(y,m){let d=new Date(y,m-1,db.settings.payDay);if(d.getDay()==6)d=addDays(d,-1);if(d.getDay()==0)d=addDays(d,-2);return d} function periodKey(d){let y=d.getFullYear(),m=d.getMonth()+1,s=startFor(y,m);if(d<s){m--;if(m<1){m=12;y--}}return `${y}-${String(m).padStart(2,'0')}`} function info(k){let[y,m]=k.split('-').map(Number),s=startFor(y,m),ny=m==12?y+1:y,nm=m==12?1:m+1,e=addDays(startFor(ny,nm),-1);return{s,e,name:s.toLocaleDateString('es-PE',{month:'long',year:'numeric'})}} function shift(k,n){let[y,m]=k.split('-').map(Number),d=new Date(y,m-1+n,2);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function ensure(k){if(!db.periods[k]){db.periods[k]={income:[],expenses:[],created:Date.now()};db.templates.filter(t=>t.active!==false).forEach(t=>db.periods[k].expenses.push({...t,id:uid(),templateId:t.id,paid:0})); db.loans.filter(l=>l.active!==false).forEach(l=>{let sch=l.schedule?.find(x=>x.period===k);if(sch&&!db.periods[k].expenses.some(e=>e.loanScheduleId==sch.id))db.periods[k].expenses.push({id:uid(),name:`Cuota ${l.name}`,category:'Préstamos',amount:sch.amount,paid:sch.paid||0,criticality:'critical',due:sch.due,loanId:l.id,loanScheduleId:sch.id,type:'loan'})});save()}return db.periods[k]} function sum(a,f){return a.reduce((t,x)=>t+Number(f(x)||0),0)} function stats(){let p=ensure(pk),income=sum(p.income,x=>x.amount),planned=sum(p.expenses,x=>x.amount),paid=sum(p.expenses,x=>x.paid),pending=Math.max(0,planned-paid),available=income-paid,projected=income-planned;return{p,income,planned,paid,pending,available,projected}}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)} function setTheme(t){db.settings.theme=t;document.documentElement.dataset.theme=t;save()} setTheme(db.settings.theme||'light');
function updatePeriod(){let x=info(pk);$('#periodName').textContent=x.name[0].toUpperCase()+x.name.slice(1);$('#periodRange').textContent=`${x.s.toLocaleDateString('es-PE')} — ${x.e.toLocaleDateString('es-PE')}`}
function render(){ensure(pk);updatePeriod();$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.r===route)); ({home, payments, loans, moves, more}[route]||home)()}
function section(t,p=''){return `<div class="section"><div><h2>${t}</h2><p>${p}</p></div></div>`} function empty(t){return `<div class="card empty">${t}</div>`} function crit(c){return c==='critical'?'Crítico':c==='important'?'Importante':'Flexible'}
function home(){let s=stats(),pct=s.planned?Math.min(100,s.paid/s.planned*100):0,by={};s.p.expenses.forEach(e=>by[e.category]=(by[e.category]||0)+Number(e.amount));let max=Math.max(1,...Object.values(by));let alerts='';if(s.projected<0)alerts+=`<div class="alert bad">⚠ Tus compromisos superan tus ingresos en <b>${money(Math.abs(s.projected))}</b>.</div>`;let due=s.p.expenses.filter(e=>e.paid<e.amount).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,4);$('#view').innerHTML=`<div class="card hero"><div class="label">DISPONIBLE ACTUAL</div><div class="big ${s.available<0?'bad':''}">${money(s.available)}</div><div class="muted" style="font-size:11px">Saldo proyectado al cerrar: <b class="${s.projected<0?'bad':'good'}">${money(s.projected)}</b></div><div class="progress"><i style="width:${pct}%"></i></div></div><div class="grid two" style="margin-top:10px"><div class="card"><div class="label">INGRESOS</div><div class="kpi good">${money(s.income)}</div></div><div class="card"><div class="label">PENDIENTE</div><div class="kpi warn">${money(s.pending)}</div></div><div class="card"><div class="label">PAGADO</div><div class="kpi">${money(s.paid)}</div></div><div class="card"><div class="label">COMPROMISOS</div><div class="kpi">${money(s.planned)}</div></div></div><div style="margin-top:10px">${alerts}</div>${section('Acciones rápidas')}<div class="actions"><button class="quick" onclick="incomeForm()"><b>＋</b>Ingreso</button><button class="quick" onclick="expenseForm()"><b>−</b>Gasto</button><button class="quick" onclick="loanForm()"><b>↔</b>Préstamo</button><button class="quick" onclick="accountForm()"><b>▣</b>Cuenta</button></div>${section('Próximos pagos','Pendientes del periodo')}<div class="list">${due.length?due.map(expenseRow).join(''):empty('No tienes pagos pendientes.')}</div>${section('Gastos por categoría')}<div class="card bars">${Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${money(v).replace('S/ ','')}</b></div>`).join('')||'<div class="empty">Sin gastos todavía</div>'}</div>`}
function expenseRow(e){let pending=Math.max(0,Number(e.amount)-Number(e.paid||0)),status=pending<=0?'Pagado':e.paid>0?'Parcial':'Pendiente';return `<div class="item"><div><strong>${e.name}</strong><div class="meta"><span>${e.category||'Otros'}</span><span class="badge ${e.criticality}">${crit(e.criticality)}</span>${e.due?`<span>${parseD(e.due).toLocaleDateString('es-PE')}</span>`:''}<span>${status}</span></div></div><div class="amount">${money(e.amount)}<div style="margin-top:6px">${pending>0?`<button class="btn small" onclick="payExpense('${e.id}')">Pagar</button>`:`<span class="good">✓</span>`}</div></div></div>`}
let filter=''; function payments(){let p=ensure(pk),rows=p.expenses.filter(e=>!filter||e.name.toLowerCase().includes(filter.toLowerCase())||e.category.toLowerCase().includes(filter.toLowerCase()));$('#view').innerHTML=`${section('Pagos del periodo','Fijos, variables y cuotas')}<div class="search"><input id="q" placeholder="Buscar gasto o categoría" value="${filter}"><button class="btn" onclick="expenseForm()">＋</button></div><div class="list">${rows.length?rows.map(expenseRow).join(''):empty('No hay gastos en este periodo.')}</div>`;$('#q').oninput=e=>{filter=e.target.value;payments()}}
function loans(){let active=db.loans.filter(x=>x.active!==false);$('#view').innerHTML=`${section('Préstamos','Controlados por separado')}<button class="btn" onclick="loanForm()">＋ Nuevo préstamo</button><div class="list" style="margin-top:10px">${active.length?active.map(l=>{let total=sum(l.schedule||[],x=>x.amount),paid=sum(l.schedule||[],x=>x.paid),left=Math.max(0,total-paid),pct=total?paid/total*100:0;return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><strong>${l.name}</strong><div class="meta"><span>${l.schedule.length} cuotas</span><span>Inicio ${l.start}</span></div></div><div class="amount">${money(left)}<div class="muted" style="font-size:9px">saldo</div></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="meta" style="justify-content:space-between"><span>Pagado ${money(paid)}</span><button class="btn secondary small" onclick="loanDetail('${l.id}')">Ver cuotas</button></div></div>`}).join(''):empty('Aún no registras préstamos.')}</div>`}
function moves(){let rows=[...db.moves].sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`${section('Movimientos','Ingresos y pagos registrados')}<div class="list">${rows.length?rows.slice(0,100).map(m=>`<div class="item"><div><strong>${m.name}</strong><div class="meta"><span>${m.date}</span><span>${m.type==='income'?'Ingreso':'Pago'}</span></div></div><div class="amount ${m.type==='income'?'good':'bad'}">${m.type==='income'?'+':'−'} ${money(m.amount)}</div></div>`).join(''):empty('Todavía no hay movimientos.')}</div>`}
function more(){let periods=Object.keys(db.periods).sort().reverse();$('#view').innerHTML=`${section('Más','Configuración y herramientas')}<div class="menu"><button onclick="settingsForm()">⚙ Configuración<small>Día de pago, presupuesto y apariencia</small></button><button onclick="categoriesForm()">▦ Categorías<small>Organiza tus tipos de gasto</small></button><button onclick="accountsView()">▣ Cuentas y tarjetas<small>Saldo manual de tus cuentas</small></button><button onclick="calendarView()">◫ Calendario de pagos<small>Vencimientos del periodo</small></button><button onclick="historyView()">↺ Historial por mes<small>${periods.length} periodos guardados</small></button><button onclick="backup()">⬇ Crear respaldo<small>Descarga un JSON con todos tus datos</small></button><button onclick="$('#restore').click()">⬆ Restaurar respaldo<small>Recupera un respaldo anterior</small></button><button onclick="exportExcel()">▤ Exportar para Excel<small>Descarga un CSV del periodo actual</small></button></div>`}
function show(title,body,saveFn,saveText='Guardar'){dlgTitle.textContent=title;dlgBody.innerHTML=body;dlgFoot.innerHTML=`<button class="btn secondary" onclick="dlg.close()">Cancelar</button>${saveFn?`<button class="btn" id="saveDlg">${saveText}</button>`:''}`;if(saveFn)$('#saveDlg').onclick=saveFn;dlg.showModal()}
function val(id){return $('#'+id).value} function num(id){return Number(val(id)||0)}
function incomeForm(){show('Registrar ingreso',`<div class="form"><div class="field full"><label>Concepto</label><input id="fName" value="Sueldo"></div><div class="field"><label>Monto</label><input id="fAmount" type="number" step="0.01"></div><div class="field"><label>Fecha</label><input id="fDate" type="date" value="${dateISO(info(pk).s)}"></div></div>`,()=>{let a=num('fAmount');if(a<=0)return toast('Ingresa un monto');let p=ensure(pk),x={id:uid(),name:val('fName'),amount:a,date:val('fDate')};p.income.push(x);db.moves.push({...x,type:'income',period:pk});save();dlg.close();render();toast('Ingreso registrado')})}
function expenseForm(){show('Nuevo gasto',`<div class="form"><div class="field full"><label>Nombre</label><input id="fName" placeholder="Ej. Movilidad"></div><div class="field"><label>Monto estimado/real</label><input id="fAmount" type="number" step="0.01"></div><div class="field"><label>Vencimiento</label><input id="fDue" type="date"></div><div class="field"><label>Categoría</label><select id="fCat">${db.categories.map(c=>`<option>${c}</option>`)}</select></div><div class="field"><label>Criticidad</label><select id="fCrit"><option value="critical">Crítico</option><option value="important" selected>Importante</option><option value="flexible">Flexible</option></select></div><div class="field full"><label><input id="fRec" type="checkbox"> Repetir automáticamente cada periodo</label></div></div>`,()=>{let a=num('fAmount'),name=val('fName').trim();if(!name||a<=0)return toast('Completa nombre y monto');let e={id:uid(),name,amount:a,paid:0,due:val('fDue'),category:val('fCat'),criticality:val('fCrit'),type:'expense'};ensure(pk).expenses.push(e);if($('#fRec').checked)db.templates.push({...e,id:uid(),active:true});save();dlg.close();render();toast('Gasto agregado')})}
function payExpense(id){let e=ensure(pk).expenses.find(x=>x.id===id),pending=Math.max(0,e.amount-e.paid);show('Registrar pago',`<div class="form"><div class="field full"><label>${e.name} · Pendiente ${money(pending)}</label><input id="fPay" type="number" step="0.01" value="${pending.toFixed(2)}"></div><div class="field full"><label>Fecha</label><input id="fDate" type="date" value="${dateISO(new Date())}"></div></div>`,()=>{let a=Math.min(pending,num('fPay'));if(a<=0)return;e.paid=Number(e.paid||0)+a;if(e.loanScheduleId){let l=db.loans.find(x=>x.id===e.loanId),s=l?.schedule.find(x=>x.id===e.loanScheduleId);if(s)s.paid=Number(s.paid||0)+a}db.moves.push({id:uid(),name:e.name,amount:a,date:val('fDate'),type:'expense',period:pk});save();dlg.close();render();toast('Pago registrado')},'Confirmar pago')}
function loanForm(){show('Nuevo préstamo',`<div class="form"><div class="field full"><label>Nombre</label><input id="fName" placeholder="Ej. Préstamo 1"></div><div class="field"><label>Monto recibido</label><input id="fPrincipal" type="number" step="0.01"></div><div class="field"><label>Cuota mensual</label><input id="fQuota" type="number" step="0.01"></div><div class="field"><label>Número de cuotas</label><input id="fN" type="number" min="1" value="4"></div><div class="field"><label>Primera cuota</label><input id="fStart" type="date" value="${dateISO(info(pk).s)}"></div></div>`,()=>{let name=val('fName').trim(),q=num('fQuota'),n=Math.max(1,parseInt(val('fN'))||1),principal=num('fPrincipal');if(!name||q<=0)return toast('Completa nombre y cuota');let first=parseD(val('fStart')),schedule=[];for(let i=0;i<n;i++){let d=new Date(first.getFullYear(),first.getMonth()+i,first.getDate());schedule.push({id:uid(),due:dateISO(d),period:periodKey(d),amount:q,paid:0})}let l={id:uid(),name,principal,start:val('fStart'),active:true,schedule};db.loans.push(l);schedule.forEach(s=>{let p=ensure(s.period);if(!p.expenses.some(e=>e.loanScheduleId===s.id))p.expenses.push({id:uid(),name:`Cuota ${name}`,category:'Préstamos',amount:s.amount,paid:0,due:s.due,criticality:'critical',loanId:l.id,loanScheduleId:s.id,type:'loan'})});if(principal>0){ensure(pk).income.push({id:uid(),name:`Desembolso ${name}`,amount:principal,date:dateISO(new Date())});db.moves.push({id:uid(),name:`Desembolso ${name}`,amount:principal,date:dateISO(new Date()),type:'income',period:pk})}save();dlg.close();render();toast('Préstamo creado')})}
function loanDetail(id){let l=db.loans.find(x=>x.id===id);show(l.name,`<div class="list">${l.schedule.map((s,i)=>`<div class="item"><div><strong>Cuota ${i+1}</strong><div class="meta"><span>${s.due}</span><span>${s.paid>=s.amount?'Pagada':s.paid>0?'Parcial':'Pendiente'}</span></div></div><div class="amount">${money(s.amount)}<div class="muted" style="font-size:9px">pagado ${money(s.paid)}</div></div></div>`).join('')}</div>`,null)}
function accountForm(){show('Nueva cuenta o tarjeta',`<div class="form"><div class="field full"><label>Nombre</label><input id="fName" placeholder="BCP, Yape, Efectivo..."></div><div class="field"><label>Tipo</label><select id="fType"><option>Cuenta</option><option>Tarjeta</option><option>Efectivo</option></select></div><div class="field"><label>Saldo referencial</label><input id="fAmount" type="number" step="0.01"></div></div>`,()=>{db.accounts.push({id:uid(),name:val('fName'),type:val('fType'),balance:num('fAmount')});save();dlg.close();render();toast('Cuenta agregada')})}
function accountsView(){show('Cuentas y tarjetas',`<div class="list">${db.accounts.length?db.accounts.map(a=>`<div class="item"><div><strong>${a.name}</strong><div class="meta"><span>${a.type}</span></div></div><div class="amount">${money(a.balance)}</div></div>`).join(''):'<div class="empty">Sin cuentas registradas.</div>'}</div><div style="margin-top:10px"><button class="btn" onclick="dlg.close();accountForm()">＋ Agregar cuenta</button></div>`,null)}
function categoriesForm(){show('Categorías',`<div class="list">${db.categories.map(c=>`<div class="item"><strong>${c}</strong><button class="btn secondary small" onclick="removeCat('${encodeURIComponent(c)}')">Eliminar</button></div>`).join('')}</div><div class="field" style="margin-top:12px"><label>Nueva categoría</label><input id="newCat"></div>`,()=>{let c=val('newCat').trim();if(c&&!db.categories.includes(c))db.categories.push(c);save();dlg.close();categoriesForm()},'Agregar')}
function removeCat(c){c=decodeURIComponent(c);db.categories=db.categories.filter(x=>x!==c);save();dlg.close();categoriesForm()}
function settingsForm(){show('Configuración',`<div class="form"><div class="field"><label>Día habitual de pago</label><input id="fDay" type="number" min="1" max="28" value="${db.settings.payDay}"></div><div class="field"><label>Presupuesto mensual objetivo</label><input id="fBudget" type="number" step="0.01" value="${db.settings.budget||0}"></div><div class="field full"><label>Si el pago cae sábado/domingo, la app usa automáticamente el viernes anterior.</label></div></div>`,()=>{db.settings.payDay=Math.min(28,Math.max(1,parseInt(val('fDay'))||15));db.settings.budget=num('fBudget');save();pk=periodKey(new Date());dlg.close();render();toast('Configuración guardada')})}
function calendarView(){let rows=ensure(pk).expenses.filter(e=>e.due).sort((a,b)=>a.due.localeCompare(b.due));show('Calendario de pagos',`<div class="list">${rows.length?rows.map(e=>`<div class="item"><div><strong>${parseD(e.due).toLocaleDateString('es-PE',{day:'2-digit',month:'short'})} · ${e.name}</strong><div class="meta"><span>${e.category}</span><span>${e.paid>=e.amount?'Pagado':'Pendiente'}</span></div></div><div class="amount">${money(e.amount-e.paid)}</div></div>`).join(''):'<div class="empty">Sin fechas registradas.</div>'}</div>`,null)}
function historyView(){let rows=Object.keys(db.periods).sort().reverse();show('Historial por periodo',`<div class="list">${rows.map(k=>{let old=pk;pk=k;let s=stats();pk=old;return `<div class="item"><div><strong>${info(k).name}</strong><div class="meta"><span>Ingresos ${money(s.income)}</span><span>Gastos ${money(s.planned)}</span></div></div><button class="btn secondary small" onclick="pk='${k}';dlg.close();route='home';render()">Abrir</button></div>`}).join('')}</div>`,null)}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mi-dinero-respaldo-${dateISO(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);toast('Respaldo creado')}
$('#restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());db=Object.assign(structuredClone(defaults),x);save();pk=periodKey(new Date());render();toast('Respaldo restaurado')}catch{toast('Archivo no válido')}e.target.value=''};
function csvEsc(v){return `"${String(v??'').replaceAll('"','""')}"`} function exportExcel(){let p=ensure(pk),rows=[['Tipo','Concepto','Categoría','Monto','Pagado','Pendiente','Criticidad','Fecha']];p.income.forEach(x=>rows.push(['Ingreso',x.name,'',x.amount,x.amount,0,'',x.date]));p.expenses.forEach(x=>rows.push(['Gasto',x.name,x.category,x.amount,x.paid,x.amount-x.paid,crit(x.criticality),x.due]));let csv='\ufeff'+rows.map(r=>r.map(csvEsc).join(';')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Mi-Dinero-${pk}.csv`;a.click();URL.revokeObjectURL(a.href)}
$('#prev').onclick=()=>{pk=shift(pk,-1);render()};$('#next').onclick=()=>{pk=shift(pk,1);render()};$('#period').onclick=historyView;$('#theme').onclick=()=>setTheme(db.settings.theme==='dark'?'light':'dark');$$('#nav button').forEach(b=>b.onclick=()=>{route=b.dataset.r;render()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script>
</body></html>
